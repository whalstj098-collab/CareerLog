<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>경험 등록 - CareerLog</title>

    <link rel="stylesheet" href="../assets/css/common/reset.css" />
    <link rel="stylesheet" href="../assets/css/common/variables.css" />
    <link rel="stylesheet" href="../assets/css/common/common.css" />
    <link rel="stylesheet" href="../assets/css/components/button.css" />
    <link rel="stylesheet" href="../assets/css/components/card.css" />
    <link rel="stylesheet" href="../assets/css/components/navbar.css" />
    <link rel="stylesheet" href="../assets/css/pages/register.css" />
  </head>

  <body>
    <header class="navbar">
      <h1 class="logo">CareerLog</h1>

      <nav>
        <a href="../index.html">홈</a>
        <a href="converter.html">경험 변환</a>
        <a href="diagnose.html">노동환경 진단</a>
        <a href="jobs.html">직무 탐색</a>
      </nav>

      <a href="register.html" class="btn">경험 등록</a>
    </header>

    <main class="container">
      <section class="title">
        <p>EXPERIENCE</p>
        <h2>경험 등록</h2>
        <p>내가 했던 아르바이트 경험을 입력해 주세요.</p>
      </section>

      <form id="experienceForm" class="card">
        <label for="workName">근무처</label>
        <input type="text" id="workName" placeholder="예: 스타벅스" />

        <label for="workType">근무 형태</label>
        <select id="workType">
          <option value="">선택해 주세요</option>
          <option value="카페">카페</option>
          <option value="편의점">편의점</option>
          <option value="음식점">음식점</option>
          <option value="판매">판매</option>
          <option value="기타">기타</option>
        </select>

        <label for="startDate">시작 날짜</label>
        <input type="date" id="startDate" />

        <label for="endDate">종료 날짜</label>
        <input type="date" id="endDate" />

        <label for="workContent">주요 업무</label>
        <textarea
          id="workContent"
          rows="6"
          placeholder="예: 고객 응대, 계산, 재고 정리"
        ></textarea>

        <div class="form-button">
          <a href="../index.html" class="btn">취소</a>
          <button type="submit" class="btn btn-primary">경험 등록</button>
        </div>
      </form>
    </main>

    <footer>
      <p>CareerLog</p>
      <p>오늘의 경험을 내일의 경력으로</p>
    </footer>

    <script src="../assets/js/pages/register.js"></script>
  </body>
</html>
