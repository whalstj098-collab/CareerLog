<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>경험 변환 - CareerLog</title>

    <link rel="stylesheet" href="../assets/css/common/reset.css" />
    <link rel="stylesheet" href="../assets/css/common/variables.css" />
    <link rel="stylesheet" href="../assets/css/common/common.css" />
    <link rel="stylesheet" href="../assets/css/components/button.css" />
    <link rel="stylesheet" href="../assets/css/components/card.css" />
    <link rel="stylesheet" href="../assets/css/components/navbar.css" />
    <link rel="stylesheet" href="../assets/css/pages/converter.css" />
  </head>

  <body>
    <header class="navbar">
      <h1 class="logo">CareerLog</h1>

      <nav>
        <a href="../index.html">홈</a>
        <a href="converter.html">경험 변환</a>
        <a href="diagnose.html">노동환경 진단</a>
        <a href="jobs.html">직무 탐색</a>
      </nav>

      <a href="register.html" class="btn">경험 등록</a>
    </header>

    <main class="container">
      <section class="title">
        <p>EXPERIENCE -> CAREER</p>
        <h2>경험 변환</h2>
        <p>아르바이트 경험을 직무 역량으로 바꿔 보세요.</p>
      </section>

      <section class="card converter">
        <label for="experience">경험 선택</label>

        <select id="experience">
          <option value="">경험을 선택해 주세요</option>
          <option value="cafe">카페 아르바이트</option>
          <option value="store">편의점 아르바이트</option>
          <option value="book">서점 아르바이트</option>
        </select>

        <label for="work">한 일</label>

        <textarea
          id="work"
          rows="5"
          placeholder="예: 손님 주문을 받고 음료를 만들었습니다."
        ></textarea>

        <button type="button" id="convertButton" class="btn btn-primary">
          경험 변환
        </button>
      </section>

      <section class="card result" id="result">
        <h2>변환 결과</h2>

        <p id="resultText">경험을 선택하고 변환 버튼을 눌러 주세요.</p>
      </section>
    </main>

    <footer>
      <p>CareerLog</p>
      <p>오늘의 경험을 내일의 경력으로</p>
    </footer>

    <script src="../assets/js/pages/converter.js"></script>
  </body>
</html>
